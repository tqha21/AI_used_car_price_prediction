name: LuxDrive AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-sast:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest bandit flake8
        
    - name: SAST - Security Scan with Bandit
      run: |
        bandit -r luxdrive/ -c pyproject.toml -ll
        
    - name: Linting with Flake8
      run: |
        flake8 luxdrive/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Unit Tests (Pytest)
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/luxdrive
        export SECRET_KEY='test-key'
        pytest luxdrive/tests/ -v
